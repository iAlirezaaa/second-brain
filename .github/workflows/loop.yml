name: loop
on:
  schedule:
    - cron: "30 3 * * *" # nightly ratchet cycle
  workflow_dispatch:

permissions:
  contents: write

jobs:
  nightly:
    # pinned, not `ubuntu-latest`: a floating image moved to 26.04 and killed the nightly loop
    # in setup-python for five runs while the local gates stayed green
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        # 3.12, not 3.9: the nightly loop's own availability is a promise the repo makes
        # (a loop that dies in setup-python stops improving in silence), and the 3.9 floor
        # is proved by the ci matrix on a runner that still installs it. See ci.yml.
        with:
          python-version: "3.12"
      # the ratchet reads state, writes candidates only to 14_CANDIDATES/loop
      # The cron is the alarm; `11_CONTROL/schedules/SCH-…-improvement-loop.json` is
      # the rule. A manual dispatch is a human override and always runs.
      - name: Is the cycle due?
        id: due
        if: github.event_name == 'schedule'
        run: |
          if python scripts/loop.py --due; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Improvement loop cycle
        if: github.event_name != 'schedule' || steps.due.outputs.run == 'true'
        run: python scripts/loop.py --no-tests --vault vault-template
        continue-on-error: true # P1 findings must still produce a report commit
      - name: Commit candidate report
        run: |
          git config user.name "improvement-loop"
          git config user.email "actions@users.noreply.github.com"
          git add 14_CANDIDATES/loop/
          if git diff --cached --quiet; then
            echo "quiet house — nothing to report"
          else
            git commit -m "loop(nightly): candidate report $(date +%F)"
            git push
          fi
